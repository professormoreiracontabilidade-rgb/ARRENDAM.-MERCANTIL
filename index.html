<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10115b"><title>CPC 06 • 40 Telas | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 12%,#6721bd,transparent 42%),radial-gradient(circle at 92% 85%,#0079db,transparent 45%),#10115b;color:white;font-family:system-ui,'Arial Black',Arial,sans-serif}main{max-width:900px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px;gap:12px}.brand{text-align:center;font-weight:1000;color:#ffe53d;font-size:clamp(15px,3.2vw,24px);text-shadow:0 2px 0 #21144e}.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px}.progress{height:9px;background:#ffffff38;border-radius:12px;overflow:hidden}.fill{height:100%;width:2.5%;background:linear-gradient(90deg,#00ffb0,#fff12a);transition:width .3s}.slide{position:relative;flex:1;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;border:4px solid #ffe43a;border-radius:30px;padding:clamp(18px,5vw,42px);box-shadow:0 14px 0 #070839,0 20px 45px #0008;background:linear-gradient(145deg,#233bcb,#711fbd 56%,#e11286);overflow:hidden}.slide:before{content:'';position:absolute;inset:-25%;background:radial-gradient(circle at 15% 15%,#fff3 0,transparent 30%),radial-gradient(circle at 90% 90%,#00e5ff44,transparent 30%);pointer-events:none}.emoji{font-size:clamp(58px,13vw,100px);filter:drop-shadow(0 6px 2px #0005);z-index:1}.kicker{z-index:1;background:#ffe22c;color:#18104c;padding:8px 18px;border-radius:18px;font-weight:1000;font-size:clamp(20px,5vw,39px);box-shadow:0 6px 0 #d17a00;line-height:1.13}.message{z-index:1;font-size:clamp(27px,6.4vw,55px);line-height:1.15;font-weight:1000;text-wrap:balance;text-shadow:0 4px 2px #090d5a}.detail{z-index:1;font-size:clamp(19px,4.3vw,31px);line-height:1.25;font-weight:800;background:#081a69b8;border:2px solid #ffffff77;padding:13px 18px;border-radius:18px;text-wrap:balance}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}button{border:0;border-radius:16px;padding:16px 7px;font-size:clamp(14px,3.6vw,20px);font-weight:1000;cursor:pointer;color:#111344;box-shadow:0 5px 0 #050627}button:active{transform:translateY(3px);box-shadow:0 2px 0 #050627}.back{background:#ffe53d}.reset{background:#fff}.next{background:#00e8a6}button:disabled{opacity:.45;cursor:default}.foot{text-align:center;font-size:12px;opacity:.8;padding-bottom:env(safe-area-inset-bottom)}@media(max-height:690px){.slide{min-height:330px;gap:10px}.emoji{font-size:46px}.message{font-size:clamp(23px,5vw,42px)}.detail{font-size:clamp(17px,3.5vw,25px)}}
</style></head><body><main><div class="brand">📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="top"><span>🎯 CPC 06 (R2) • ARRENDAMENTOS</span><span id="count">1 / 40</span></div><div class="progress"><div class="fill" id="fill"></div></div><section class="slide" id="slide" aria-live="polite"><div class="emoji" id="emoji"></div><div class="kicker" id="kicker"></div><div class="message" id="message"></div><div class="detail" id="detail"></div></section><nav class="controls"><button class="back" id="back">⬅ VOLTAR</button><button class="reset" id="reset">🔄 REINICIAR</button><button class="next" id="next">AVANÇAR ➡</button></nav><div class="foot">Deslize para navegar • Também funciona com as setas do teclado • Progresso salvo</div></main><script>
const slides=[["🎓", "CPC 06 (R2)", "ARRENDAMENTOS", "40 telas • Treinamento para o CFC"], ["📣", "DICA DE OURO", "O arrendatário reconhece, em regra, ATIVO e PASSIVO.", "Guarde essa ideia!"], ["🤝", "O QUE É ARRENDAMENTO?", "Contrato que transmite o direito de controlar o uso de um ativo identificado por certo período.", "Em troca de contraprestação."], ["🏢", "ARRENDADOR", "É quem concede o direito de uso do ativo.", "Exemplo: proprietário do equipamento."], ["👨‍💼", "ARRENDATÁRIO", "É quem obtém o direito de usar o ativo.", "Exemplo: empresa que utiliza o equipamento."], ["🔄", "COMO FUNCIONA?", "ARRENDADOR ➜ DIREITO DE USO ➜ ARRENDATÁRIO", "ARRENDATÁRIO ➜ PAGAMENTOS ➜ ARRENDADOR"], ["🔍", "ATIVO IDENTIFICADO", "O ativo precisa ser especificado explícita ou implicitamente.", "Atenção aos direitos substantivos de substituição."], ["🧩", "EXEMPLO", "Uma máquina específica é disponibilizada por 4 anos.", "Pode existir arrendamento se houver controle do uso."], ["🕹️", "CONTROLE DO USO", "O cliente deve obter substancialmente todos os benefícios econômicos do uso.", "E ter direito de direcionar o uso, conforme as regras."], ["⚠️", "NÃO BASTA ALUGAR", "É preciso verificar se o contrato contém um arrendamento.", "Nem todo contrato de serviço contém arrendamento."], ["📚", "REGRA DO ARRENDATÁRIO", "Em regra, reconhece ATIVO DE DIREITO DE USO e PASSIVO DE ARRENDAMENTO.", "Modelo único de reconhecimento."], ["🟦", "ATIVO", "DIREITO DE USO", "Representa o direito de utilizar o bem durante o prazo."], ["🟪", "PASSIVO", "PASSIVO DE ARRENDAMENTO", "Representa a obrigação de efetuar pagamentos."], ["💡", "PEGADINHA CFC", "No arrendatário, em regra, não se separa operacional e financeiro para reconhecimento.", "Existem isenções opcionais."], ["⏱️", "ISENÇÃO 1", "ARRENDAMENTO DE CURTO PRAZO", "Prazo de até 12 meses na data de início e sem opção de compra."], ["💰", "ISENÇÃO 2", "ATIVO SUBJACENTE DE BAIXO VALOR", "Avaliado pelo valor do ativo quando novo."], ["📝", "IMPORTANTE", "As isenções são opções de reconhecimento previstas no CPC 06.", "Não significam que o pronunciamento inteiro deixa de valer."], ["🧾", "SE USAR A ISENÇÃO", "Os pagamentos podem ser reconhecidos como despesa, geralmente linearmente.", "Ou por outra base sistemática apropriada."], ["📅", "CURTO PRAZO", "Até 12 meses — não é simplesmente “menos de 1 ano”.", "E não pode conter opção de compra."], ["🪑", "BAIXO VALOR", "Exemplos possíveis: pequenos equipamentos de escritório.", "Depende da avaliação do ativo subjacente."], ["📊", "MENSURAÇÃO INICIAL", "PASSIVO = VALOR PRESENTE DOS PAGAMENTOS", "Considere os pagamentos incluídos na mensuração."], ["🧮", "VALOR PRESENTE", "Os pagamentos futuros são descontados por uma taxa apropriada.", "Taxa implícita, se prontamente determinável; senão, incremental."], ["🔢", "EXEMPLO SIMPLES", "Pagamentos futuros: R$ 36.000.", "O passivo inicial não é necessariamente R$ 36.000: usa-se o valor presente."], ["🏗️", "DIREITO DE USO", "O ativo de direito de uso é inicialmente mensurado pelo CUSTO.", "Não confunda custo com valor nominal das prestações."], ["🧱", "PONTO DE PARTIDA", "O custo começa pelo valor inicial do PASSIVO DE ARRENDAMENTO.", "Mas pode conter outros componentes."], ["💵", "SOMA AO CUSTO", "Pagamentos feitos na data de início ou antes dela.", "Deduzidos os incentivos de arrendamento recebidos."], ["🧾", "SOMA AO CUSTO", "CUSTOS DIRETOS INICIAIS incorridos pelo arrendatário.", "Quando atendem à definição do CPC 06."], ["🛠️", "SOMA AO CUSTO", "Estimativa de desmontagem, remoção e restauração, quando aplicável.", "Conforme as obrigações assumidas."], ["📌", "FÓRMULA MENTAL", "DIREITO DE USO = PASSIVO INICIAL + AJUSTES DO CUSTO", "Pagamentos antecipados, custos diretos, restauração e incentivos."], ["🧮", "EXEMPLO DIDÁTICO", "Passivo inicial: R$ 80.000. Custos diretos: R$ 3.000.", "Sem outros ajustes: direito de uso = R$ 83.000."], ["📒", "LANÇAMENTO INICIAL", "D – Ativo de direito de uso", "C – Passivo de arrendamento (e outras contas, se aplicável)."], ["📉", "DEPOIS DO INÍCIO", "O direito de uso é normalmente depreciado.", "Aplicam-se também as regras pertinentes de mensuração e redução ao valor recuperável."], ["🏦", "DESPESA FINANCEIRA", "O passivo de arrendamento gera JUROS.", "O saldo é atualizado e reduzido pelos pagamentos."], ["💳", "PAGAMENTO", "O pagamento reduz o passivo de arrendamento.", "A despesa financeira é reconhecida separadamente."], ["🚫", "CUIDADO COM A FRASE", "“Nunca existe despesa de arrendamento” está ERRADO.", "Isenções e certos pagamentos variáveis podem gerar despesa."], ["🔁", "MODELO GERAL", "Em vez de uma despesa única de aluguel:", "Depreciação do direito de uso + juros do passivo."], ["🏷️", "E O ARRENDADOR?", "Para o arrendador, continua relevante classificar em operacional ou financeiro.", "Não confunda com o modelo do arrendatário."], ["🎯", "REVISÃO RÁPIDA", "PASSIVO ➜ VALOR PRESENTE", "DIREITO DE USO ➜ CUSTO"], ["🧠", "MEMORIZE PARA O CFC", "CURTO PRAZO / BAIXO VALOR: ISENÇÕES OPCIONAIS.", "REGRA GERAL: ATIVO + PASSIVO."], ["🏆", "PARABÉNS!", "VOCÊ CONCLUIU AS 40 TELAS!", "Curso de Contabilidade Professor Moreira • Compartilhe com seus colegas!"]];let i=Math.max(0,Math.min(39,Number(localStorage.getItem('moreira_cpc06_slide')||0)));const $=id=>document.getElementById(id);function render(){let s=slides[i];['emoji','kicker','message','detail'].forEach((id,j)=>$(id).textContent=s[j]);$('count').textContent=(i+1)+' / 40';$('fill').style.width=((i+1)/40*100)+'%';$('back').disabled=i===0;$('next').disabled=i===39;localStorage.setItem('moreira_cpc06_slide',i)}function go(n){i=Math.max(0,Math.min(39,i+n));render()}$('back').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('reset').onclick=()=>{i=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let x=0;$('slide').addEventListener('touchstart',e=>{x=e.changedTouches[0].screenX},{passive:true});$('slide').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-x;if(Math.abs(dx)>65)go(dx<0?1:-1)},{passive:true});render();
</script></body></html>
